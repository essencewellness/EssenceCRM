<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Essence Wellness — Atribuir Sessão</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./essence-forms.css">
  <style>
    .plain-fg { margin-bottom: 22px; }
    .plain-label {
      display: block; margin-bottom: 8px;
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--smoke);
    }
    .plain-input, .plain-select, .plain-textarea {
      width: 100%; background: var(--field-bg); border: 1px solid var(--border-input);
      border-radius: 4px; color: var(--bone); font-family: 'Lato', sans-serif;
      font-size: 15px; padding: 12px 14px; outline: none;
    }
    .plain-textarea { resize: vertical; min-height: 90px; }
    .plain-select { appearance: none; -webkit-appearance: none; cursor: pointer; }
    .plain-input:focus, .plain-select:focus, .plain-textarea:focus { border-color: var(--champagne); }
    .booking-card {
      background: var(--overlay); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px 18px; margin-bottom: 28px;
    }
    .booking-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 13px; }
    .booking-row span:first-child { color: var(--smoke); }
    .booking-row span:last-child { color: var(--bone); font-weight: 500; text-align: right; }
    .price-prefix { position: relative; }
    .price-prefix::before {
      content: '€'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--champagne-soft); font-size: 15px; pointer-events: none;
    }
    .price-prefix .plain-input { padding-left: 28px; }
    .state-msg { text-align: center; padding: 60px 24px; font-family: 'Libre Baskerville', serif; font-style: italic; color: var(--smoke); }
    .visita-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
      border-radius: 100px; font-family: 'Montserrat', sans-serif; font-size: 10px;
      font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px;
    }
    .visita-badge.nova { background: rgba(122,158,126,0.12); color: var(--sage); border: 1px solid rgba(122,158,126,0.3); }
    .visita-badge.recorrente { background: rgba(212,184,134,0.1); color: var(--champagne); border: 1px solid var(--border-input); }
    .notas-box {
      background: var(--overlay); border: 1px solid var(--border);
      border-radius: 6px; padding: 14px 18px; margin-bottom: 22px;
    }
    .notas-titulo {
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--smoke); margin-bottom: 10px;
    }
    .nota-item { font-size: 13px; line-height: 1.5; padding: 8px 0; border-top: 1px solid var(--border); }
    .nota-item:first-child { border-top: none; padding-top: 0; }
    .nota-autor { color: var(--smoke); font-size: 11px; margin-top: 3px; }
  </style>
</head>
<body>

<div class="card">

  <header class="header">
    <div class="header-inner">
      <img class="header-logo" src="./logo-lotus.png" alt="Essence Wellness">
      <div class="header-brand">
        <div class="header-name">Essence Wellness</div>
        <div class="header-title">Atribuir <em>Sessão</em></div>
      </div>
    </div>
  </header>

  <div class="form-body">
    <div class="gerr" id="gerr"></div>

    <div id="loading" class="state-msg">A carregar a marcação…</div>
    <div id="erro-carregar" class="state-msg" style="display:none;">Não foi possível carregar esta marcação. Verifica o link.</div>

    <form id="form-atribuir" style="display:none;">
      <div id="visita-badge"></div>
      <div class="booking-card" id="booking-card"></div>
      <div class="notas-box" id="notas-box" style="display:none;">
        <div class="notas-titulo">Notas sobre esta cliente</div>
        <div id="notas-lista"></div>
      </div>

      <!-- Massagem a dois: não há nada para escolher — são sempre as duas
           terapeutas, ao mesmo tempo. Este bloco substitui o seletor. -->
      <div class="plain-fg" id="bloco-a-dois" style="display:none;">
        <label class="plain-label">Quem vai fazer a massagem</label>
        <div class="plain-input" id="texto-a-dois" style="display:flex;align-items:center;min-height:44px;"></div>
      </div>

      <div class="plain-fg" id="bloco-individual">
        <label class="plain-label" for="terapeuta">Quem vai fazer a massagem *</label>
        <select id="terapeuta" class="plain-select"></select>
      </div>

      <div class="plain-fg">
        <label class="plain-label" for="preco">Preço da sessão *</label>
        <div class="price-prefix">
          <input type="number" id="preco" class="plain-input" step="0.01" min="0" inputmode="decimal">
        </div>
      </div>

      <div class="plain-fg">
        <label class="plain-label" for="nota">Nota sobre esta cliente <span style="font-weight:400;text-transform:none;letter-spacing:0;">(opcional)</span></label>
        <textarea id="nota" class="plain-textarea" placeholder="Ex: já falámos no WhatsApp, ela pediu para experimentar aromaterapia com bergamota…"></textarea>
      </div>

      <div class="hp" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

      <div class="nav"><button type="submit" class="btn-primary" id="btn-submit"><span>Guardar ✦</span></button></div>
    </form>

    <div class="success" id="success" style="display:none;">
      <h2>Guardado.</h2>
      <p>A sessão foi atribuída e a nota ficou registada no perfil da cliente.</p>
    </div>
  </div>

  <footer class="footer">Essence Wellness — uso interno.</footer>
</div>

<script>
(function () {
  "use strict";
  const API_BASE = location.protocol === "file:" ? "http://localhost:3000" : "";
  const sessaoId = new URLSearchParams(location.search).get("sessaoId");
  // Massagem a dois: preenchido no carregar(), lido no submit.
  let eADois = false;
  let terapeutasADois = null;
  const linkToken = new URLSearchParams(location.search).get("t");
  const tokenQS = linkToken ? `&t=${encodeURIComponent(linkToken)}` : "";

  const elLoading = document.getElementById("loading");
  const elErro = document.getElementById("erro-carregar");
  const elForm = document.getElementById("form-atribuir");
  const elSuccess = document.getElementById("success");
  const elGerr = document.getElementById("gerr");

  function formatarData(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  // Mostra sempre o indicativo — a Bea abre isto no telemóvel e tem de poder
  // contactar a cliente sem adivinhar o país. 9 dígitos = número nacional
  // português; qualquer outro comprimento já traz indicativo próprio.
  function formatarTelefone(tel) {
    const d = String(tel || "").replace(/\D/g, "");
    if (!d) return null;
    const completo = d.length === 9 ? "351" + d : d;
    const legivel = completo.startsWith("351")
      ? "+351 " + completo.slice(3).replace(/(\d{3})(?=\d)/g, "$1 ").trim()
      : "+" + completo;
    return { legivel, e164: "+" + completo, whatsapp: "https://wa.me/" + completo };
  }

  async function carregar() {
    if (!sessaoId) {
      elLoading.style.display = "none";
      elErro.style.display = "block";
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/v1/public/atribuir-sessao?sessaoId=${encodeURIComponent(sessaoId)}${tokenQS}`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      // Uso único: já foi preenchido antes — mostra logo o estado, sem
      // gastar tempo (nem risco) a mostrar um formulário para nada.
      if (data.jaSubmetido) {
        elLoading.style.display = "none";
        const h2 = elSuccess.querySelector("h2");
        const p = elSuccess.querySelector("p");
        if (h2) h2.textContent = "Já preenchido.";
        if (p) {
          p.textContent = data.terapeutaAtribuida
            ? `Esta sessão já foi atribuída a ${data.terapeutaAtribuida}.`
            : "Esta sessão já tem os dados preenchidos.";
        }
        elSuccess.style.display = "block";
        return;
      }

      const visitaBadge = document.getElementById("visita-badge");
      visitaBadge.replaceChildren();
      const badge = document.createElement("span");
      if (data.cliente.primeiraVisita) {
        badge.className = "visita-badge nova";
        badge.textContent = "🌱 Primeira visita";
      } else {
        badge.className = "visita-badge recorrente";
        const n = data.cliente.totalSessoesAnteriores;
        const habitual = data.cliente.terapeutaHabitual;
        badge.textContent = `🔁 Já é cliente — ${n} sessõe${n === 1 ? "" : "s"} anterior${n === 1 ? "" : "es"}` +
          (habitual ? ` · Habitual: ${habitual.name}` : "");
      }
      visitaBadge.appendChild(badge);

      const bookingCard = document.getElementById("booking-card");
      bookingCard.replaceChildren();
      const tel = formatarTelefone(data.cliente.telefone);
      const rows = [
        ["Cliente", data.cliente.nome],
        ["Telefone", tel ? tel.legivel : "—", tel ? tel.whatsapp : null],
        ["Serviço", data.sessao.servico || "—"],
        ["Data", data.sessao.data ? formatarData(data.sessao.data) : "—"],
        ["Hora", data.sessao.hora || "—"],
      ];
      rows.forEach(([label, value, href]) => {
        const row = document.createElement("div");
        row.className = "booking-row";
        const l = document.createElement("span");
        l.textContent = label;
        // Telefone abre o WhatsApp diretamente (não a app de chamadas)
        const v = document.createElement(href ? "a" : "span");
        if (href) {
          v.href = href;
          v.target = "_blank";
          v.rel = "noopener";
          v.style.cssText = "color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;";
        }
        v.textContent = value;
        row.append(l, v);
        bookingCard.appendChild(row);
      });

      const notasBox = document.getElementById("notas-box");
      const notasLista = document.getElementById("notas-lista");
      notasLista.replaceChildren();
      if (data.notas && data.notas.length) {
        data.notas.forEach((n) => {
          const item = document.createElement("div");
          item.className = "nota-item";
          const texto = document.createElement("div");
          texto.textContent = n.texto;
          const autor = document.createElement("div");
          autor.className = "nota-autor";
          autor.textContent = `— ${n.autor}, ${formatarData(n.criadoEm)}`;
          item.append(texto, autor);
          notasLista.appendChild(item);
        });
        notasBox.style.display = "block";
      } else {
        notasBox.style.display = "none";
      }

      // Massagem a dois: com exatamente 2 terapeutas ativas, não há nada
      // para perguntar — são sempre as duas. Fora deste caso exato (uma só
      // terapeuta ativa, ou um dia terceira), a pergunta continua a ser
      // feita normalmente, para nunca adivinhar errado.
      eADois = /a dois|casal/i.test(data.sessao.servico || "") && (data.terapeutas || []).length === 2;
      terapeutasADois = eADois ? data.terapeutas : null;

      const blocoADois = document.getElementById("bloco-a-dois");
      const blocoIndividual = document.getElementById("bloco-individual");
      const selTerapeuta = document.getElementById("terapeuta");

      if (eADois) {
        blocoADois.style.display = "block";
        blocoIndividual.style.display = "none";
        document.getElementById("texto-a-dois").textContent =
          data.terapeutas.map((t) => t.name || t.id).join(" e ");
      } else {
        blocoADois.style.display = "none";
        blocoIndividual.style.display = "block";
        selTerapeuta.replaceChildren();
        if (data.terapeutas && data.terapeutas.length) {
          data.terapeutas.forEach((t) => {
            const opt = document.createElement("option");
            opt.value = t.id;
            opt.textContent = t.name || t.id;
            selTerapeuta.appendChild(opt);
          });
          if (data.cliente.terapeutaHabitual) {
            selTerapeuta.value = data.cliente.terapeutaHabitual.id;
          }
        } else {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Sem terapeutas ativas";
          selTerapeuta.appendChild(opt);
        }
      }

      const precoInicial = data.precoBase ?? data.sessao.precoAtual ?? "";
      document.getElementById("preco").value = precoInicial !== null ? precoInicial : "";

      elLoading.style.display = "none";
      elForm.style.display = "block";
    } catch (err) {
      console.error(err);
      elLoading.style.display = "none";
      elErro.style.display = "block";
    }
  }

  document.getElementById("form-atribuir").addEventListener("submit", async function (e) {
    e.preventDefault();
    elGerr.classList.remove("show");

    const btn = document.getElementById("btn-submit");
    const span = btn.querySelector("span");
    const original = span.textContent;
    span.textContent = "A guardar…";
    btn.disabled = true;

    const payload = {
      sessaoId,
      ...(linkToken ? { t: linkToken } : {}),
      // A dois: as duas terapeutas já foram decididas ao carregar, sem
      // pergunta nenhuma — vão as duas na mesma ordem que foram mostradas.
      ...(eADois
        ? { terapeutaId: terapeutasADois[0].id, terapeuta2Id: terapeutasADois[1].id }
        : { terapeutaId: document.getElementById("terapeuta").value }),
      preco: document.getElementById("preco").value,
      nota: document.getElementById("nota").value.trim() || null,
      website: document.getElementById("website").value,
    };

    try {
      const res = await fetch(`${API_BASE}/api/v1/public/atribuir-sessao`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);

      elForm.style.display = "none";
      elSuccess.style.display = "block";
    } catch (err) {
      console.error(err);
      elGerr.textContent = "Ocorreu um erro ao guardar. Por favor, tenta novamente.";
      elGerr.classList.add("show");
      span.textContent = original;
      btn.disabled = false;
    }
  });

  carregar();
})();
</script>
</body>
</html>
