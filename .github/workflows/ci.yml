name: CI

# Verificação contínua — NÃO faz deploy. O deploy é automático via Vercel
# em qualquer push para main (integração Git → Vercel). Este workflow existe
# apenas para apanhar erros de tipo/lint/build ANTES de chegarem a produção,
# já que hoje não há nenhum gate automático entre `git push` e o deploy.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Type-check, lint e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Sem .nvmrc nem campo "engines" no package.json neste repo — Node 22
      # (LTS "Jod") é a versão usada como referência.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Necessário antes do type-check/build: o Prisma Client é gerado com
      # output custom (ver prisma/schema.prisma) e não existe até isto correr.
      # Só lê o schema — não liga a nenhuma base de dados.
      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build

      # A suite Playwright (tests/e2e/, playwright.config.ts) já existe no
      # repo mas AINDA NÃO corre aqui — precisa de uma base de dados Postgres
      # real neste workflow (serviço `postgres` + `DATABASE_URL` apontado
      # para ela, seguido de `prisma db push` antes dos testes), que é mais
      # trabalho de configuração do que os passos acima. Ficou
      # propositadamente por adicionar — não esquecer de o fazer.
